
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{name}} - Resume</title>
  <style>
    body { font-family: 'Arial', sans-serif; margin: 0; display: flex; }
    .sidebar { background: #34495e; color: white; padding: 30px; width: 30%; min-height: 100vh; }
    .sidebar h1 { font-size: 28px; margin: 0 0 10px; }
    .sidebar p { font-size: 14px; }
    .main { padding: 30px; width: 70%; }
    h2 { color: #34495e; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    .section { margin-bottom: 25px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1>{{name}}</h1>
    <p>{{email}}<br>{{phone}}<br>{{linkedin}}</p>
    <h3>About Me</h3>
    <p>{{summary}}</p>
  </div>
  <div class="main">
    <div class="section">
      <h2>Education</h2>
      {{education_section}}
    </div>
    <div class="section">
      <h2>Experience</h2>
      {{work_experience_section}}
    </div>
    <div class="section">
      <h2>Projects</h2>
      {{projects_section}}
    </div>
    <div class="section">
      <h2>Hobbies</h2>
      <p>{{hobbies}}</p>
    </div>
  </div>
</body>
</html>
