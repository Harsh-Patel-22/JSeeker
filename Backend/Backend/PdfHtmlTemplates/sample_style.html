
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{name}} - Resume</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      background: #fff;
      color: #333;
    }

    .left-panel {
      width: 70%;
      padding: 40px;
      background: #fff;
    }

    .right-panel {
      width: 30%;
      padding: 30px 20px;
      background: #fef6f2;
      border-left: 1px solid #e0e0e0;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 16px;
      color: #c0392b;
      text-transform: uppercase;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      padding-bottom: 3px;
    }

    .section {
      margin-bottom: 25px;
    }

    ul {
      padding-left: 20px;
      margin: 5px 0;
    }

    .right-panel h3 {
      font-size: 14px;
      text-transform: uppercase;
      margin-top: 20px;
      margin-bottom: 10px;
      color: #c0392b;
    }

    .contact, .skills, .education, .languages {
      font-size: 13px;
      line-height: 1.5;
    }

    .highlight-box {
      background: #f3e6de;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .highlight-box p {
      margin: 0;
    }

    .lang-level {
      display: flex;
      justify-content: space-between;
    }

    .entry-title {
      font-weight: bold;
    }

    .entry-meta {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="left-panel">
    <h1>{{name}}</h1>

    <div class="section">
      <h2>Summary</h2>
      <p>{{summary}}</p>
    </div>

    <div class="section">
      <h2>Experience</h2>
      {{experience_section}}
    </div>

    <div class="section">
      <h2>Projects</h2>
      {{projects_section}}
    </div>
  </div>

  <div class="right-panel">
    <div class="highlight-box contact">
      <p>{{phone}}</p>
      <p>{{email}}</p>
      <p>{{address}}</p>
    </div>

    <div class="skills">
      <h3>Skills</h3>
      <ul>
        {{skills_section}}
      </ul>
    </div>

    <div class="education">
      <h3>Education & Training</h3>
      {{education_section}}
    </div>

    <div class="languages">
      <h3>Languages</h3>
      <div class="lang-level">
        <span>English:</span><span>C2</span>
      </div>
      <div class="lang-level">
        <span>Hindi:</span><span>Native</span>
      </div>
      <div class="lang-level">
        <span>Bengali:</span><span>B2</span>
      </div>
    </div>
  </div>
</body>
</html>
